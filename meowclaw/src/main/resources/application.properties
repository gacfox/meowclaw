spring.application.name=meowclaw
server.address=127.0.0.1
server.port=8080
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Jackson
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
# Tasks
spring.task.execution.thread-name-prefix=async-task-
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=200
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=60
# Base data directory (overridable via MEOWCLAW_DATA_DIR env var)
meowclaw.data-dir=${MEOWCLAW_DATA_DIR:data}
meowclaw.workspace-dir=${meowclaw.data-dir}/workspace
# Datasource
spring.datasource.url=jdbc:h2:file:./${meowclaw.data-dir}/db/meowclaw
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# SQL Init
spring.sql.init.mode=always
# SpringData JPA
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
# Actuator
management.server.address=127.0.0.1
management.server.port=9000
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
# JWT
meowclaw.jwt.secret=MeowClaw2026SecretKeyForJwtTokenSigningMustBeLongEnough
meowclaw.jwt.expire-hours=72
